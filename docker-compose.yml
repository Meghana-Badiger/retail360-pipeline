services:                                       # 'version' line removed — obsolete, caused the WARN

  postgres:
    image: postgres:15
    container_name: retail360_postgres
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail123
      POSTGRES_DB: retail_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "retail"]
      interval: 10s
      retries: 5

  airflow-init:
    image: apache/airflow:2.8.1                 # Plain image is enough — only sets up DB + admin user
    container_name: retail360_airflow_init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail:retail123@postgres/retail_dw
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: on-failure

  airflow-webserver:
    build: .                                    # NEW: build image from ./Dockerfile
    image: retail360-airflow:2.8.1              # NEW: name of the built image
    container_name: retail360_airflow_webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail:retail123@postgres/retail_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PG_HOST: postgres                         # NEW: spark_ingest.py connects to Postgres by service name
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: webserver
    restart: always

  airflow-scheduler:
    build: .                                    # NEW: same image as webserver
    image: retail360-airflow:2.8.1              # NEW
    container_name: retail360_airflow_scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail:retail123@postgres/retail_dw
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PG_HOST: postgres                         # NEW: needed here — the scheduler runs the tasks
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./ingestion:/opt/airflow/ingestion
      - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
    command: scheduler
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: retail360_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: retail360_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  superset:
    image: apache/superset:3.0.0
    container_name: retail360_superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "retail360supersetsecretkey"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: